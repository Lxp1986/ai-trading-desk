<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI自主交易事业部 · 本地控制台</title>
<style>
:root{--bg:#090b12;--panel:#111521;--panel2:#151a28;--line:#252c3d;--text:#eef1f8;--muted:#8992a7;--purple:#8b5cf6;--cyan:#38bdf8;--green:#35d399;--amber:#f6c453;--red:#fb7185;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#242052 0,#090b12 42%);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}
.shell{display:flex;min-height:100vh}.side{width:238px;background:rgba(10,12,20,.9);border-right:1px solid var(--line);padding:25px 17px}.brand{display:flex;gap:11px;align-items:center;margin:0 10px 36px}.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--purple),#4f46e5);display:grid;place-items:center;font-weight:800}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.nav-title{color:#5c667b;font-size:11px;margin:24px 11px 9px;text-transform:uppercase;letter-spacing:.08em}.nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;margin:3px 0;color:#aeb7ca;text-decoration:none;border-radius:9px}.nav a.active{color:#fff;background:linear-gradient(90deg,rgba(139,92,246,.27),rgba(139,92,246,.08));box-shadow:inset 3px 0 var(--purple)}.nav i{font-style:normal;width:18px;text-align:center}.side-foot{position:absolute;bottom:22px;width:198px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:11px;line-height:1.6}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 9px var(--green)}main{flex:1;padding:28px 34px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:25px}.eyebrow{color:var(--purple);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}.top h1{margin:7px 0 5px;font-size:26px;letter-spacing:-.03em}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;align-items:center}.btn{border:1px solid var(--line);background:var(--panel);color:#dfe5f2;border-radius:8px;padding:9px 13px;font-size:12px;cursor:pointer}.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}.mode{padding:8px 11px;border:1px solid rgba(53,211,153,.35);background:rgba(53,211,153,.1);color:var(--green);border-radius:7px;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:linear-gradient(145deg,rgba(21,26,40,.96),rgba(14,18,29,.96));border:1px solid var(--line);border-radius:12px}.card{padding:17px 18px;min-height:115px}.label{color:var(--muted);font-size:12px}.value{font:25px var(--mono);margin:12px 0 7px}.green{color:var(--green)}.amber{color:var(--amber)}.red{color:var(--red)}.trend{color:var(--green);font-size:11px}.grid{display:grid;grid-template-columns:1.45fr .9fr;gap:14px;margin-top:14px}.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.panel h2{font-size:15px;margin:0}.muted{color:var(--muted);font-size:11px}.chart{height:200px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(139,92,246,.06),transparent)}svg{width:100%;height:100%}.chart-label{position:absolute;right:10px;top:8px;color:var(--green);font:12px var(--mono)}.status-list{display:grid;gap:11px}.status{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:rgba(255,255,255,.025);border-radius:8px}.status .left{display:flex;align-items:center;gap:9px}.check{color:var(--green)}.badge{font-size:10px;padding:4px 7px;border-radius:5px;background:rgba(53,211,153,.11);color:var(--green)}.badge.blue{background:rgba(56,189,248,.1);color:var(--cyan)}.badge.amber{background:rgba(246,196,83,.12);color:var(--amber)}.badge.red{background:rgba(251,113,133,.12);color:var(--red)}.badge.gray{background:rgba(137,146,167,.12);color:#b7c0d2}.bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{text-align:left;color:var(--muted);font-weight:400;padding:9px 7px;border-bottom:1px solid var(--line)}.table td{padding:12px 7px;border-bottom:1px solid rgba(37,44,61,.7)}.mono{font-family:var(--mono)}.side-buy{color:var(--green)}.side-sell{color:var(--red)}.notice{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.notice:last-child{border:0}.notice-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:rgba(53,211,153,.12);color:var(--green)}.notice-icon.blue{background:rgba(56,189,248,.12);color:var(--cyan)}.notice-icon.amber{background:rgba(246,196,83,.12);color:var(--amber)}.notice-icon.red{background:rgba(251,113,133,.12);color:var(--red)}.notice b{display:block;font-size:12px;margin-bottom:4px}.notice span{color:var(--muted);font-size:11px;line-height:1.5}@media(max-width:900px){.side{width:74px}.brand div:not(.mark),.brand small,.nav-title,.nav span,.side-foot{display:none}.brand{margin:0 3px 36px}.nav a{justify-content:center}.cards{grid-template-columns:repeat(2,1fr)}.grid,.bottom{grid-template-columns:1fr}main{padding:20px}.top{display:block}.actions{margin-top:16px}}
</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><div class="mark">AI</div><div><b>自主交易事业部</b><small>LOCAL CONTROL PLANE</small></div></div><div class="nav-title">工作台</div><nav class="nav"><a href="#"><i>◈</i><span>经营总览</span></a><a href="#"><i>◒</i><span>市场与策略</span></a><a href="#"><i>▣</i><span>持仓与订单</span></a><a href="#"><i>⌁</i><span>Agent团队</span></a></nav><div class="nav-title">治理与审计</div><nav class="nav"><a href="#"><i>✓</i><span>风险控制</span></a><a href="#"><i>≡</i><span>经营报告</span></a><a href="#"><i>⚠</i><span>事件中心</span></a></nav><div class="side-foot"><span class="dot"></span>本机安全模式<br>127.0.0.1 · 无公网暴露<br>当前：模拟盘 / Testnet</div></aside><main><div id="page"></div></main></div><script>
const pageEl=document.getElementById('page');
const pages={
overview:`<header class="top"><div><div class="eyebrow">CEO OPERATING CONSOLE · v0.2</div><h1>经营总览</h1><div class="sub">董事长观点仅作为研究输入 · CEO独立决策 · 风控独立否决</div></div><div class="actions"><span class="mode" id="mode-ov">● 本机模拟运行中</span><button class="btn" data-action="report">生成经营报告</button><button class="btn primary" data-action="assumptions">查看交易假设</button></div></header><section class="cards"><div class="card"><div class="label">模拟净值</div><div class="value" id="ov-nav">-- USDT</div><div class="trend" id="ov-nav-trend">加载中</div></div><div class="card"><div class="label">当前风险暴露</div><div class="value" id="ov-risk">-- USDT</div><div class="trend" id="ov-risk-trend">加载中</div></div><div class="card"><div class="label">本项目Token消耗</div><div class="value" id="ov-token">--</div><div class="trend">仅统计本项目 · Hermes路由</div></div><div class="card"><div class="label">运行状态</div><div class="value" id="ov-conn">--</div><div class="trend" id="ov-conn-trend">检测中</div></div></section><section class="grid"><div class="panel"><div class="panel-head"><h2>净值曲线</h2><span class="muted" id="chart-sub">实时净值</span></div><div class="chart"><span class="chart-label" id="chart-label">-- USDT</span><svg viewBox="0 0 800 200" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient></defs><path id="chart-path" d="M0 180 L800 160" fill="none" stroke="#8b5cf6" stroke-width="3"/><path id="chart-fill" d="M0 180 L800 160 L800 200 L0 200Z" fill="url(#fill)"/><path d="M0 176 H800 M0 126 H800 M0 76 H800" stroke="#252c3d" stroke-width="1" stroke-dasharray="4 7"/><circle id="chart-dot" cx="800" cy="160" r="5" fill="#35d399" stroke="#111521" stroke-width="3"/></svg></div></div><div class="panel"><div class="panel-head"><h2>系统与员工状态</h2><span class="badge" id="staff-count">加载中</span></div><div class="status-list" id="staff-list"><div class="muted">读取中...</div></div></div></section><div class="bottom"><div class="panel"><div class="panel-head"><h2>最近交易假设</h2><span class="muted">本地审计记录</span></div><table class="table"><thead><tr><th>时间</th><th>标的</th><th>方向</th><th>价值</th><th>状态</th></tr></thead><tbody id="ov-decisions"><tr><td colspan="5" class="muted">读取中</td></tr></tbody></table></div><div class="panel"><div class="panel-head"><h2>事件与报告</h2><span class="muted">实时</span></div><div id="ov-events"><div class="muted">读取中...</div></div></div></div>`,
market:`<header class="top"><div><div class="eyebrow">MARKET & STRATEGY</div><h1>市场与策略</h1><div class="sub">本机行情、市场状态与策略观察</div></div><div class="actions"><span class="mode" id="mode-mk">● 模拟盘</span><button class="btn primary" data-action="refresh">刷新行情</button></div></header><section class="cards"><div class="card"><div class="label">BTC/USDT</div><div class="value mono" id="mk-price">读取中</div><div class="trend">Binance Spot Testnet</div></div><div class="card"><div class="label">市场状态</div><div class="value amber" id="mk-trend">待判定</div><div class="trend" id="mk-indicators">指标待接入</div></div><div class="card"><div class="label">策略模式</div><div class="value" id="mk-strategy-mode">观察</div><div class="trend" id="mk-strategy-trend">自适应权重运行中</div></div><div class="card"><div class="label">数据质量</div><div class="value" id="mk-data-quality">--</div><div class="trend" id="mk-data-trend">检测中</div></div></section><div class="grid"><div class="panel"><div class="panel-head"><h2>市场观察</h2><span class="muted">实时刷新</span></div><table class="table"><tbody><tr><td>BTC/USDT价格</td><td id="mk-price2" class="mono">读取中</td></tr><tr><td>数据源</td><td>Binance Spot Testnet</td></tr><tr><td>市场状态</td><td id="mk-state2">读取中</td></tr><tr><td>CEO结论</td><td id="mk-ceo">等待决策介入</td></tr><tr><td>策略权重</td><td id="mk-weights">读取中</td></tr></tbody></table></div><div class="panel"><div class="panel-head"><h2>策略候选</h2><span class="badge" id="mk-strategies-count">加载中</span></div><div class="status-list" id="mk-strategies"><div class="muted">读取中...</div></div></div></div>`,
positions:`<header class="top"><div><div class="eyebrow">POSITIONS & ORDERS</div><h1>持仓与订单</h1><div class="sub">测试网虚拟订单与本地审计账本</div></div><div class="actions"><span class="mode">● 无真实资金风险</span><button class="btn primary" data-action="refresh">刷新状态</button></div></header><section class="cards"><div class="card"><div class="label">虚拟账户净值</div><div class="value" id="ps-nav">-- USDT</div><div class="trend" id="ps-nav-detail">本地模拟账本</div></div><div class="card"><div class="label">当前持仓</div><div class="value" id="ps-pos">-- USDT</div><div class="trend" id="ps-pos-detail">持仓详情</div></div><div class="card"><div class="label">现金余额</div><div class="value" id="ps-cash">-- USDT</div><div class="trend">账本主记录</div></div><div class="card"><div class="label">审计记录</div><div class="value" id="ps-audit">读取中</div><div class="trend">JSONL可回放</div></div></section><div class="panel"><div class="panel-head"><h2>最近交易意图</h2><span class="muted">CEO → 风控 → 执行</span></div><table class="table"><thead><tr><th>时间</th><th>标的</th><th>方向</th><th>价值</th><th>状态</th></tr></thead><tbody id="ps-decisions"><tr><td colspan="5" class="muted">读取中</td></tr></tbody></table></div>`,
agents:`<header class="top"><div><div class="eyebrow">AGENT ORGANIZATION</div><h1>Agent团队</h1><div class="sub">岗位、能力和真实工作状态</div></div><div class="actions"><span class="mode" id="ag-mode">● 全员待命</span></div></header><div class="panel"><div class="panel-head"><h2>员工花名册</h2><span class="muted" id="ag-count">读取中</span></div><div class="status-list" id="ag-list"><div class="muted">读取中...</div></div></div>`,
risk:`<header class="top"><div><div class="eyebrow">RISK CONTROL</div><h1>风险控制</h1><div class="sub">硬边界由程序强制，不可因自信突破</div></div><div class="actions"><span class="mode" id="rk-mode">● 风控引擎正常</span></div></header><section class="cards"><div class="card"><div class="label">连续亏损</div><div class="value" id="rk-losses">--</div><div class="trend">阈值 5 笔 → 暂停新仓</div></div><div class="card"><div class="label">当前回撤</div><div class="value" id="rk-drawdown">--</div><div class="trend">15% 停自动 / 25% 全平</div></div><div class="card"><div class="label">可用现金</div><div class="value" id="rk-cash">-- USDT</div><div class="trend">单笔风险预算 1%</div></div><div class="card"><div class="label">流动性状态</div><div class="value" id="rk-liquidity">--</div><div class="trend" id="rk-liquidity-trend">交易前检查</div></div></section><div class="grid"><div class="panel"><div class="panel-head"><h2>硬风控边界</h2><span class="badge">程序强制</span></div><table class="table"><tbody><tr><td>连亏 ≥5 笔</td><td>暂停新仓（只允许减仓/平仓）</td></tr><tr><td>回撤 ≥15%</td><td>停止自动开仓</td></tr><tr><td>回撤 ≥25%</td><td>全平模式</td></tr><tr><td>单笔风险</td><td>|现价−止损|×数量 ≤ 现金×1%</td></tr><tr><td>禁止</td><td>马丁格尔 / 亏损加仓 / 满仓 / 取消硬止损</td></tr></tbody></table></div><div class="panel"><div class="panel-head"><h2>熔断状态</h2><span class="badge" id="rk-halt-badge">正常</span></div><div id="rk-halt-detail"><div class="muted">读取中...</div></div></div></div>`,
reports:`<header class="top"><div><div class="eyebrow">OPERATING REPORTS</div><h1>经营报告</h1><div class="sub">每一步运行结果均可追溯</div></div><div class="actions"><button class="btn primary" data-action="download-report">下载当前报告</button></div></header><div class="panel"><div class="panel-head"><h2>当前经营快照</h2><span class="badge">模拟盘</span></div><div class="status-list"><div class="status"><span>运行模式</span><b>Binance Spot Testnet / 本机控制台</b></div><div class="status"><span>核心模块</span><b id="rp-core">读取中</b></div><div class="status"><span>真实资金</span><b class="green">无</b></div><div class="status"><span>净值</span><b id="rp-nav">读取中</b></div><div class="status"><span>最新审计记录</span><b id="rp-audit">读取中</b></div></div></div>`,
incidents:`<header class="top"><div><div class="eyebrow">INCIDENT CENTER</div><h1>事件中心</h1><div class="sub">API、订单、Token和资金异常将在这里留下记录</div></div><div class="actions"><span class="mode" id="ic-mode">● 当前无已知异常</span></div></header><div class="panel"><div class="panel-head"><h2>事件记录</h2><span class="muted" id="ic-count">实时</span></div><div id="ic-list"><div class="muted">读取中...</div></div></div>`
};
function show(page){pageEl.innerHTML=pages[page]||pages.overview;document.querySelectorAll('.nav a').forEach((a,i)=>a.classList.toggle('active',['overview','market','positions','agents','risk','reports','incidents'][i]===page));refreshLive();}
function downloadReport(){const text='AI自主交易事业部经营报告\n模式：Binance Spot Testnet 模拟盘\n计价单位：USDT\n起始资金：277.00 USDT\n本机控制台：127.0.0.1\n'+new Date().toISOString();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='operating-report.txt';a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('click',e=>{const nav=e.target.closest('.nav a');if(nav){e.preventDefault();show(nav.dataset.page)}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='download-report')downloadReport();if(action==='refresh')refreshLive();if(action==='report')show('reports');if(action==='assumptions')show('positions')});
document.querySelectorAll('.nav a').forEach((a,i)=>a.dataset.page=['overview','market','positions','agents','risk','reports','incidents'][i]);
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmtTime(t){if(!t)return '—';const s=String(t);return s.length>=16?s.slice(5,16):s}
function sideText(side){return side==='buy'?'买入':side==='sell'?'卖出':'观望'}
function sideCls(side){return side==='buy'?'side-buy':side==='sell'?'side-sell':''}
function renderDecisions(tbodyId,s){const tb=document.getElementById(tbodyId);if(!tb)return;const rows=(s.recent_decisions||[]).map(d=>{const status=d.approved?'<span class="badge">风控通过</span>':'<span class="badge gray">风控拒绝</span>';return '<tr><td class="mono">'+fmtTime(d.time)+'</td><td class="mono">'+esc(d.symbol)+'</td><td class="'+sideCls(d.side)+'">'+sideText(d.side)+'</td><td class="mono">'+Number(d.value||0).toFixed(2)+' USDT</td><td>'+status+'</td></tr>'}).join('');tb.innerHTML=rows||'<tr><td colspan="5" class="muted">暂无交易假设记录</td></tr>'}
function renderEvents(elId,s){const el=document.getElementById(elId);if(!el)return;const evs=(s.events||[]).slice(-6).reverse();if(!evs.length){el.innerHTML='<div class="notice"><div class="notice-icon">✓</div><div><b>系统运行正常</b><span>无异常事件；运行循环每 15 分钟自动巡检。</span></div></div>';return}el.innerHTML=evs.map(e=>{const icon=e.level==='L3'||e.level==='L4'?'red':e.level==='L2'?'amber':'blue';const ic=e.level==='L3'||e.level==='L4'?'!':e.level==='L2'?'⚠':'↗';return '<div class="notice"><div class="notice-icon '+icon+'">'+ic+'</div><div><b>'+esc(e.type||'事件')+'</b><span>'+esc(e.detail||'')+' · '+esc(e.at||e.time||'')+'</span></div></div>'}).join('')}
function renderStaff(s){const el=document.getElementById('staff-list');if(!el)return;const badgeCls={active:'blue',ready_to_connect:'amber',queued:'gray'};const badgeText={active:'待命',ready_to_connect:'待接入',queued:'排队'};const work=s.agents_work||{};el.innerHTML=s.employees.slice(0,8).map(e=>{const b=badgeCls[e.status]||'gray';const wk=Object.keys(work).find(k=>e.name.startsWith(k)||k.startsWith(e.name));const w=wk?work[wk]:null;const line=w?'<div class="muted" style="margin-top:3px">最近 '+w.last_run.slice(5,16)+' · '+esc(w.output||w.status)+'</div>':'';return '<div class="status"><div><b>'+esc(e.name)+'</b>'+line+'</div><span class="badge '+b+'">'+(badgeText[e.status]||e.status)+'</span></div>'}).join('')}
function renderAgents(s){const el=document.getElementById('ag-list');if(!el)return;const badgeCls={active:'blue',ready_to_connect:'amber',queued:'gray'};const badgeText={active:'待命',ready_to_connect:'待接入',queued:'排队'};const work=s.agents_work||{};el.innerHTML=s.employees.map(e=>{const b=badgeCls[e.status]||'gray';const wk=Object.keys(work).find(k=>e.name.startsWith(k)||k.startsWith(e.name));const w=wk?work[wk]:null;const line=w?'<div class="muted" style="margin-top:3px">最近工作 '+w.last_run+' · '+esc(w.output||w.status)+'</div>':'';return '<div class="status"><div><b>'+esc(e.name)+'</b><div class="muted">'+esc(e.responsibility)+'</div>'+line+'</div><span class="badge '+b+'">'+(badgeText[e.status]||e.status)+'</span></div>'}).join('')}
function renderStrategies(s){const el=document.getElementById('mk-strategies');if(!el)return;const active=(s.strategies||[]).filter(x=>x.status==='启用').length;const cnt=document.getElementById('mk-strategies-count');if(cnt)cnt.textContent=active+'/'+(s.strategies||[]).length+' 启用';el.innerHTML=(s.strategies||[]).map(x=>{const cls=x.badge?'badge '+x.badge:'badge';const trig=x.last_trigger?'<div class="muted">最近触发 '+x.last_trigger.slice(5,16)+'</div>':'';return '<div class="status"><div><b>'+esc(x.label)+'</b><div class="muted">'+esc(x.description)+'</div>'+trig+'</div><span class="'+cls+'">'+esc(x.status)+'</span></div>'}).join('')}
function renderChart(s){const el=document.getElementById('chart-label');if(!el)return;const nav=Number(s.nav??0);el.textContent=nav.toFixed(2)+' USDT';const start=Number(s.starting_capital||277);const pct=start>0?(nav-start)/start:0;const y=170-Math.max(-100,Math.min(100,pct*400));const path=document.getElementById('chart-path');if(path)path.setAttribute('d','M0 170 L800 '+y);const fill=document.getElementById('chart-fill');if(fill)fill.setAttribute('d','M0 170 L800 '+y+' L800 200 L0 200Z');const dot=document.getElementById('chart-dot');if(dot)dot.setAttribute('cy',y);const sub=document.getElementById('chart-sub');if(sub)sub.textContent='净值 '+(pct>=0?'+':'')+(pct*100).toFixed(2)+'% · 实时'}
async function refreshLive(){try{const r=await fetch('/api/status',{cache:'no-store'});const s=await r.json();
document.querySelectorAll('.mode').forEach(m=>{if(s.risk?.trading_halted)m.textContent='● 风控熔断中';else if(s.local_only)m.textContent='● 本机模拟运行中'});
const nav=Number(s.nav??0),cash=Number(s.cash??0),pv=Number(s.position_value??0);
const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
set('ov-nav',nav.toFixed(2)+' USDT');set('ov-nav-trend','净值 · 回撤 '+Number(s.max_drawdown_pct??0).toFixed(2)+'%');
set('ov-risk',pv.toFixed(2)+' USDT');set('ov-risk-trend','持仓市值 · 现金 '+cash.toFixed(2));
set('ov-token',Number(s.token_usage?.total_tokens||0).toLocaleString('en-US')+' tokens');
const fresh=s.state_updated_at?true:false;set('ov-conn',fresh?'正常':'离线');set('ov-conn-trend',fresh?'状态更新 '+s.state_updated_at:'运行循环未启动');
set('ps-nav',nav.toFixed(2)+' USDT');set('ps-nav-detail','已实现 '+Number(s.realized_pnl??0).toFixed(2)+' · 浮动 '+Number(s.unrealized_pnl??0).toFixed(2));
set('ps-pos',pv.toFixed(2)+' USDT');const posKeys=Object.keys(s.positions||{});set('ps-pos-detail',posKeys.length?posKeys.join(', '):'当前无持仓');
set('ps-cash',cash.toFixed(2)+' USDT');set('ps-audit',s.audit_records+' 条');
set('mk-price','$'+Number(s.market?.price||0).toLocaleString('en-US',{maximumFractionDigits:2}));set('mk-price2','$'+Number(s.market?.price||0).toLocaleString('en-US',{maximumFractionDigits:2}));
const tr=s.market?.trend;set('mk-trend',tr==='trend_up'?'📈 上升趋势':tr==='trend_down'?'📉 下降趋势':'↔️ 震荡');set('mk-state2',tr||'—');
const rsi=s.market?.rsi14;if(rsi!=null)set('mk-indicators','RSI '+Number(rsi).toFixed(0)+' · 量比 '+Number(s.market.volume_ratio).toFixed(2)+' · 24h '+(Number(s.market.change_24h_pct??0)>=0?'+':'')+Number(s.market.change_24h_pct??0).toFixed(2)+'%');
set('mk-strategy-mode','自适应运行');set('mk-strategy-trend','策略权重按绩效自动调整');
set('mk-data-quality',fresh?'正常':'异常');set('mk-data-trend',fresh?'最近更新 '+s.state_updated_at:'无数据');
const dec=(s.recent_decisions||[])[0];set('mk-ceo',dec?(sideText(dec.side)+' · '+(dec.approved?'风控通过':'风控拒绝')):'等待决策介入');
const wts=(s.strategies||[]).filter(x=>x.weight<1).map(x=>x.label+'×'+x.weight);set('mk-weights',wts.length?wts.join('，'):'全部策略权重 1.0');
set('rk-losses',(s.risk?.consecutive_losses??0)+' 笔');set('rk-drawdown',Number(s.risk?.drawdown_pct??0).toFixed(2)+'%');set('rk-cash',cash.toFixed(2)+' USDT');
set('rk-liquidity',s.liquidity_ok?'正常':'异常');set('rk-liquidity-trend',s.liquidity_ok?'量价健康':'量能或波动异常，交易前检查');
const halt=s.risk?.trading_halted;const hb=document.getElementById('rk-halt-badge');if(hb){hb.textContent=halt?'熔断中':'正常';hb.className='badge'+(halt?' red':'')}const hd=document.getElementById('rk-halt-detail');if(hd){hd.innerHTML=halt?'<div class="notice"><div class="notice-icon red">!</div><div><b>熔断已触发</b><span>'+esc((s.risk?.halt_reasons||[]).join('；')||'硬边界触发')+'</span></div></div>':'<div class="muted">当前无熔断；连亏 5 笔 / 回撤 15% / 25% 自动触发。</div>'}
set('rp-core',s.staff_active+'/17 岗位待命');set('rp-nav',nav.toFixed(2)+' USDT');set('rp-audit',s.audit_records+' 条');
const ic=(s.events||[]).length;set('ic-count',ic+' 条');set('ic-mode','● '+(ic?'有 '+ic+' 条记录':'当前无已知异常'));
const sc=document.getElementById('staff-count');if(sc)sc.textContent=s.staff_active+'/17 待命';
const ac=document.getElementById('ag-count');if(ac)ac.textContent='17 岗位 · '+s.staff_active+' 待命';const agm=document.getElementById('ag-mode');if(agm)agm.textContent='● 全员待命 · 随时可指派';
renderDecisions('ov-decisions',s);renderDecisions('ps-decisions',s);renderEvents('ov-events',s);renderEvents('ic-list',s);renderStaff(s);renderAgents(s);renderStrategies(s);renderChart(s);
}catch(e){document.querySelectorAll('.mode').forEach(m=>m.textContent='● 本地界面 / API未启动')}}
show('overview');setInterval(refreshLive,5000);
</script></body></html>
